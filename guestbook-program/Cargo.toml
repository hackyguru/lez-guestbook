[package]
name = "guestbook"
version = "0.1.0"
edition = "2024"

# A risc0 guest: built with `cargo risczero build` (see build.sh), never `cargo build`.
[dependencies]
borsh = { version = "1", features = ["derive"] }
# Pinned to the same LEZ commit the wallet FFI in counter-core is built from
# (v0.3.0 + the r0 link fix) — the program must speak the testnet's ABI.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "411adc8fdb3f4c3af64354c4fc26d3e4a6a3d3f4" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }

[profile.release]
lto = true
opt-level = 3
